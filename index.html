<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scanner">
<meta name="theme-color" content="#080808">
<title>Market Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--s1:#111;--s2:#1c1c1c;--s3:#242424;--b1:rgba(255,255,255,.06);--b2:rgba(255,255,255,.11);--t1:#f0ede8;--t2:#888;--t3:#505050;--green:#4ade80;--red:#f87171;--amber:#fbbf24;--blue:#60a5fa;--purple:#a78bfa;--mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--sans);overscroll-behavior:none}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.hdr{padding:48px 16px 12px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--b1);flex-shrink:0}
.hdr-title{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--t3);text-transform:uppercase}
.hdr-clock{font-family:var(--mono);font-size:11px;color:var(--t3)}
.scroll{flex:1;overflow-y:auto;padding:12px 16px 100px;-webkit-overflow-scrolling:touch}

/* Risk banner */
.risk-banner{border-radius:12px;padding:13px 15px;margin-bottom:14px;border:1px solid var(--b2);transition:background .4s,border-color .4s}
.risk-banner.calm   {background:rgba(74,222,128,.07);border-color:rgba(74,222,128,.25)}
.risk-banner.caution{background:rgba(251,191,36,.07);border-color:rgba(251,191,36,.25)}
.risk-banner.riskoff{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.25)}
.risk-banner.loading{background:var(--s1);border-color:var(--b1)}
.rb-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.rb-label{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em}
.calm .rb-label{color:var(--green)}.caution .rb-label{color:var(--amber)}.riskoff .rb-label{color:var(--red)}.loading .rb-label{color:var(--t3)}
.rb-dots{display:flex;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--b2)}
.calm .dot.on{background:var(--green)}.caution .dot.on{background:var(--amber)}.riskoff .dot.on{background:var(--red)}
.rb-sigs{font-size:12px;color:var(--t2);margin-bottom:4px;line-height:1.5}
.rb-action{font-size:12px;font-weight:500}
.calm .rb-action{color:var(--green)}.caution .rb-action{color:var(--amber)}.riskoff .rb-action{color:var(--red)}

/* Position card */
.pos-card{background:var(--s1);border:1px solid var(--b2);border-left:3px solid var(--blue);border-radius:12px;padding:13px 15px;margin-bottom:14px}
.pos-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:11px}
.pos-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:3px}
.pos-big{font-family:var(--mono);font-size:20px;font-weight:700}
.pos-sub{font-family:var(--mono);font-size:10px;color:var(--t3);margin-top:2px}
.pos-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-bottom:9px}
.ps{background:var(--s2);border-radius:7px;padding:7px 8px}
.ps-l{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em}
.ps-v{font-family:var(--mono);font-size:11px;margin-top:2px}
.prog{height:3px;background:var(--s3);border-radius:2px;overflow:visible;position:relative;margin-bottom:3px}
.prog-fill{position:absolute;inset:0;background:linear-gradient(90deg,var(--red) 0%,var(--amber) 40%,var(--green) 100%);border-radius:2px}
.prog-thumb{position:absolute;top:-4px;width:3px;height:11px;background:var(--t1);border-radius:2px;transform:translateX(-50%)}
.prog-lbls{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--t3)}

/* Analyst card */
.analyst-card{background:var(--s1);border:1px solid var(--b2);border-radius:12px;padding:13px 15px;margin-bottom:14px}

/* Section headers */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin:16px 0 7px}
.sec-title{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--t3);text-transform:uppercase}
.sec-sub{font-family:var(--mono);font-size:9px;color:var(--t3)}

/* Baro grid */
.baro-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.baro{background:var(--s1);border:1px solid var(--b1);border-radius:9px;padding:10px 11px;cursor:pointer}
.baro:active{background:var(--s2)}
.baro-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.baro-name{font-size:12px;font-weight:500;color:var(--t1)}
.baro-tag{font-family:var(--mono);font-size:8px;font-weight:700;padding:2px 6px;border-radius:20px}
.tw{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.25)}
.tok{background:rgba(74,222,128,.10);color:var(--green);border:1px solid rgba(74,222,128,.2)}
.tne{background:var(--s3);color:var(--t3);border:1px solid var(--b1)}
.baro-val{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--t1)}
.baro-chg{font-family:var(--mono);font-size:10px;margin-top:2px}
.baro-src{font-size:9px;color:var(--t3);margin-top:2px}

/* Crypto */
.coin-card{background:var(--s1);border:1px solid var(--b1);border-radius:9px;padding:9px 11px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:4px}
.coin-card:active{background:var(--s2)}
.coin-card.xrp{border-color:rgba(96,165,250,.35)}
.cl{display:flex;align-items:center;gap:7px}
.cr{display:flex;align-items:center;gap:7px}
.c-rank{font-family:var(--mono);font-size:9px;color:var(--t3);width:14px;flex-shrink:0}
.c-sym{font-family:var(--mono);font-size:12px;font-weight:700}
.c-nm{font-size:10px;color:var(--t3);margin-top:1px}
.c-price{font-family:var(--mono);font-size:12px;text-align:right}
.c-chg{font-family:var(--mono);font-size:10px;margin-top:1px;text-align:right}
.badge{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:20px;white-space:nowrap}
.bsb{background:rgba(74,222,128,.18);color:#4ade80;border:1px solid rgba(74,222,128,.3)}
.bb{background:rgba(74,222,128,.10);color:#86efac;border:1px solid rgba(74,222,128,.2)}
.bw{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.25)}
.ba{background:rgba(248,113,113,.10);color:#fca5a5;border:1px solid rgba(248,113,113,.2)}
.bbr{background:rgba(248,113,113,.18);color:#f87171;border:1px solid rgba(248,113,113,.3)}
.sc{font-family:var(--mono);font-size:8px;color:var(--t3);margin-top:2px;text-align:right}

/* Skeletons */
.skel{background:var(--s1);border-radius:9px;animation:pulse 1.3s ease-in-out infinite}
.h48{height:48px}.h56{height:56px}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.9}}

.status{font-family:var(--mono);font-size:9px;color:var(--t3);text-align:center;padding:8px 0;letter-spacing:.04em}

/* FAB */
.fab{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--t1);color:var(--bg);font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;padding:12px 34px;border-radius:40px;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.6);z-index:40;white-space:nowrap}
.fab:active{transform:translateX(-50%) scale(.97)}.fab:disabled{opacity:.45}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:none;align-items:flex-end;backdrop-filter:blur(3px)}
.backdrop.open{display:flex}
.sheet{background:var(--s1);border-top:1px solid var(--b2);border-radius:18px 18px 0 0;width:100%;max-width:480px;margin:0 auto;padding:0 16px 44px;max-height:85vh;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sh-handle{width:30px;height:3px;background:var(--s3);border-radius:2px;margin:11px auto 16px}
.sh-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.sh-sym{font-family:var(--mono);font-size:20px;font-weight:700}
.sh-name{font-size:13px;color:var(--t2);margin-top:2px}
.sh-price{font-family:var(--mono);font-size:17px;text-align:right}
.sh-chg{font-family:var(--mono);font-size:11px;text-align:right;margin-top:2px}
.sh-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.sh-stat{background:var(--s2);border-radius:7px;padding:9px 10px}
.sh-stat-l{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.sh-stat-v{font-family:var(--mono);font-size:13px;margin-top:3px}
.sh-title{font-family:var(--mono);font-size:9px;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}
.sh-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--b1);font-size:12px}
.sh-row:last-child{border-bottom:none}
.sh-rl{color:var(--t2)}.sh-rv{font-family:var(--mono);font-size:11px}
.sh-row.tot .sh-rl{color:var(--t1);font-weight:500}
.pos-sec{background:var(--s2);border-radius:8px;padding:11px;margin-top:12px}

.up{color:var(--green)}.dn{color:var(--red)}.neu{color:var(--t2)}
</style>
</head>

  <div class="status" id="statusMsg">tap refresh to scan all markets</div>

<script>
// ── Constants ──────────────────────────────────────────────────────────
const ENTRY=1.3081,UNITS=14.716,INVESTED=19.56,STOP=1.11,TARGET=1.70;
const LEVELS={stop:1.11,support1:1.20,support2:1.28,res1:1.32,res2:1.37,target:1.70};

// ── Clock ──────────────────────────────────────────────────────────────
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-GB')}
tick();setInterval(tick,1000);

// ── Formatters ────────────────────────────────────────────────────────
function fmtP(p){
  if(p>=10000)return '$'+p.toLocaleString('en-US',{maximumFractionDigits:0});
  if(p>=1)return '$'+p.toFixed(2);
  if(p>=.01)return '$'+p.toFixed(4);
  return '$'+p.toFixed(6);
}
function fmtLarge(n){
  if(!n)return'—';
  if(n>=1e12)return'$'+(n/1e12).toFixed(2)+'T';
  if(n>=1e9)return'$'+(n/1e9).toFixed(1)+'B';
  if(n>=1e6)return'$'+(n/1e6).toFixed(1)+'M';
  return'$'+n.toFixed(0);
}
function pct(v){return(v>=0?'+':'')+v.toFixed(2)+'%'}
function pc(v){return v>0?'up':v<0?'dn':'neu'}
function avg(a){return a.reduce((x,y)=>x+y,0)/a.length}

// ── Technical Indicators ──────────────────────────────────────────────
function sma(data,n){
  if(data.length<n)return null;
  return data.slice(-n).reduce((a,b)=>a+b,0)/n;
}

function ema(data,n){
  if(data.length<n)return null;
  const k=2/(n+1);
  let e=data.slice(0,n).reduce((a,b)=>a+b,0)/n;
  for(let i=n;i<data.length;i++)e=data[i]*k+e*(1-k);
  return e;
}

function calcRSI(closes,n=14){
  if(closes.length<n+1)return 50;
  let g=0,l=0;
  for(let i=closes.length-n;i<closes.length;i++){
    const d=closes[i]-closes[i-1];
    if(d>0)g+=d;else l-=d;
  }
  let ag=g/n,al=l/n;
  if(al===0)return 100;
  return 100-(100/(1+ag/al));
}

function calcMACD(closes){
  if(closes.length<26)return null;
  const e12=ema(closes,12),e26=ema(closes,26);
  if(e12===null||e26===null)return null;
  const macdLine=e12-e26;
  // Signal line = 9-period EMA of MACD
  const macdSeries=[];
  for(let i=25;i<closes.length;i++){
    const e12i=ema(closes.slice(0,i+1),12);
    const e26i=ema(closes.slice(0,i+1),26);
    if(e12i&&e26i)macdSeries.push(e12i-e26i);
  }
  const signal=ema(macdSeries,9);
  const histogram=macdLine-(signal||0);
  return{macdLine,signal,histogram};
}

function calcBollinger(closes,n=20,mult=2){
  if(closes.length<n)return null;
  const slice=closes.slice(-n);
  const mean=avg(slice);
  const sd=Math.sqrt(slice.reduce((a,b)=>a+(b-mean)**2,0)/n);
  return{upper:mean+mult*sd,middle:mean,lower:mean-mult*sd,sd};
}

function calcATR(ohlc,n=7){
  if(!ohlc||ohlc.length<2)return null;
  const trs=[];
  for(let i=1;i<ohlc.length;i++){
    const h=ohlc[i][2],l=ohlc[i][3],pc=ohlc[i-1][4];
    trs.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));
  }
  if(trs.length<n)return avg(trs);
  return avg(trs.slice(-n));
}

function getStructure(closes){
  const c=closes.slice(-14);
  const highs=[],lows=[];
  for(let i=1;i<c.length-1;i++){
    if(c[i]>c[i-1]&&c[i]>c[i+1])highs.push(c[i]);
    if(c[i]<c[i-1]&&c[i]<c[i+1])lows.push(c[i]);
  }
  if(highs.length>=2&&lows.length>=2){
    const hh=highs[highs.length-1]>highs[highs.length-2];
    const hl=lows[lows.length-1]>lows[lows.length-2];
    const lh=highs[highs.length-1]<highs[highs.length-2];
    const ll=lows[lows.length-1]<lows[lows.length-2];
    if(hh&&hl)return'up';
    if(lh&&ll)return'down';
  }
  return'side';
}

function getDynamicLevels(closes){
  // Find actual support/resistance from recent price history
  const swingHighs=[],swingLows=[];
  for(let i=2;i<closes.length-2;i++){
    if(closes[i]>closes[i-1]&&closes[i]>closes[i-2]&&closes[i]>closes[i+1]&&closes[i]>closes[i+2])
      swingHighs.push(closes[i]);
    if(closes[i]<closes[i-1]&&closes[i]<closes[i-2]&&closes[i]<closes[i+1]&&closes[i]<closes[i+2])
      swingLows.push(closes[i]);
  }
  return{
    nearestSupport:swingLows.length?Math.max(...swingLows.filter(l=>l<closes[closes.length-1])):null,
    nearestRes:swingHighs.length?Math.min(...swingHighs.filter(h=>h>closes[closes.length-1])):null
  };
}

// ── 9-Factor Analysis Engine ──────────────────────────────────────────
function runAnalysis(xrpHist,btcHist,ohlcData,riskMode,price,xrpChange,btcChange,btcDom,fearGreed){
  const closes=xrpHist.prices.map(p=>p[1]);
  const vols=xrpHist.total_volumes.map(v=>v[1]);
  const btcCloses=btcHist.prices.map(p=>p[1]);

  const signals=[];
  let bullCount=0,bearCount=0;

  // ── 1. Moving Averages ──
  const ma7=sma(closes,7),ma20=sma(closes,20),ma50=sma(closes,Math.min(30,closes.length));
  const aboveAll=price>ma7&&price>ma20;
  const belowAll=price<ma7&&price<ma20;
  if(aboveAll){bullCount++;signals.push({bull:true,label:'Above 7 & 20-day MA',detail:'Trend is supportive'});}
  else if(belowAll){bearCount++;signals.push({bull:false,label:'Below both MAs',detail:'Downtrend pressure'});}
  else signals.push({bull:null,label:'Mixed MA signal',detail:'Transitioning'});

  // ── 2. RSI ──
  const rsiVal=calcRSI(closes,14);
  if(rsiVal<=30){bullCount++;signals.push({bull:true,label:'RSI '+rsiVal.toFixed(0)+' — oversold',detail:'Bounce historically very probable here'});}
  else if(rsiVal<=42){bullCount++;signals.push({bull:true,label:'RSI '+rsiVal.toFixed(0)+' — approaching oversold',detail:'Selling pressure easing'});}
  else if(rsiVal>=70){bearCount++;signals.push({bull:false,label:'RSI '+rsiVal.toFixed(0)+' — overbought',detail:'Caution, fade likely'});}
  else if(rsiVal>=58){bearCount++;signals.push({bull:false,label:'RSI '+rsiVal.toFixed(0)+' — elevated',detail:'Watch for rejection'});}
  else signals.push({bull:null,label:'RSI '+rsiVal.toFixed(0)+' — neutral',detail:'No edge from momentum'});

  // ── 3. MACD ──
  const macd=calcMACD(closes);
  if(macd){
    if(macd.histogram>0&&macd.macdLine>macd.signal){bullCount++;signals.push({bull:true,label:'MACD bullish crossover',detail:'Momentum turning positive'});}
    else if(macd.histogram<0&&macd.macdLine<macd.signal){bearCount++;signals.push({bull:false,label:'MACD bearish crossover',detail:'Momentum turning negative'});}
    else signals.push({bull:null,label:'MACD neutral',detail:'No clear momentum signal'});
  }

  // ── 4. Bollinger Bands ──
  const bb=calcBollinger(closes,20,2);
  if(bb){
    const pctB=(price-bb.lower)/(bb.upper-bb.lower);
    if(pctB<=0.05){bullCount++;signals.push({bull:true,label:'At lower Bollinger Band',detail:'Price stretched — mean reversion probable'});}
    else if(pctB>=0.95){bearCount++;signals.push({bull:false,label:'At upper Bollinger Band',detail:'Price extended — pullback probable'});}
    else if(bb.sd<avg(closes.slice(-20))*0.02){signals.push({bull:null,label:'Bollinger squeeze',detail:'Volatility coiling — breakout building'});}
    else signals.push({bull:null,label:'Price mid-Bollinger',detail:'No edge from bands'});
  }

  // ── 5. Market Structure ──
  const structure=getStructure(closes);
  if(structure==='up'){bullCount++;signals.push({bull:true,label:'Higher highs & higher lows',detail:'Uptrend structure intact'});}
  else if(structure==='down'){bearCount++;signals.push({bull:false,label:'Lower highs & lower lows',detail:'Downtrend structure intact'});}
  else signals.push({bull:null,label:'Sideways structure',detail:'No directional trend'});

  // ── 6. Volume ──
  const rv=avg(vols.slice(-4)),pv=avg(vols.slice(-8,-4));
  const chg4=(closes[closes.length-1]-closes[closes.length-5])/closes[closes.length-5]*100;
  if(chg4<0&&rv<pv*0.7){bullCount++;signals.push({bull:true,label:'Volume fading on sell-off',detail:'Sellers exhausting — exhaustion signal'});}
  else if(chg4>0&&rv>pv*1.2){bullCount++;signals.push({bull:true,label:'Volume expanding on rally',detail:'Conviction buying'});}
  else if(chg4<0&&rv>pv*1.3){bearCount++;signals.push({bull:false,label:'High volume selling',detail:'Distribution — real pressure'});}
  else signals.push({bull:null,label:'Volume neutral',detail:'No volume signal'});

  // ── 7. BTC Correlation & XRP/BTC ratio ──
  const btcChg3=(btcCloses[btcCloses.length-1]-btcCloses[btcCloses.length-4])/btcCloses[btcCloses.length-4]*100;
  const xrpChg3=(closes[closes.length-1]-closes[closes.length-4])/closes[closes.length-4]*100;
  const xrpBtcRatio=price/btcCloses[btcCloses.length-1];
  const prevRatio=closes[closes.length-5]/btcCloses[btcCloses.length-5];
  const ratioChg=(xrpBtcRatio-prevRatio)/prevRatio*100;
  if(btcChg3>1.5&&xrpChg3<0){bullCount++;signals.push({bull:true,label:'BTC up, XRP lagging',detail:'Catch-up trade likely — high probability'});}
  else if(btcChg3<-2&&xrpChg3>-0.5){bullCount++;signals.push({bull:true,label:'XRP holding vs BTC fall',detail:'Relative strength — bullish sign'});}
  else if(ratioChg>2){bullCount++;signals.push({bull:true,label:'XRP gaining on BTC',detail:'Outperforming the market'});}
  else if(ratioChg<-2){bearCount++;signals.push({bull:false,label:'XRP losing to BTC',detail:'Underperforming — money leaving XRP'});}
  else signals.push({bull:null,label:'XRP/BTC ratio stable',detail:'Moving with market'});

  // ── 8. BTC Dominance ──
  if(btcDom!==null){
    if(btcDom>52){bearCount++;signals.push({bull:false,label:'BTC dominance '+btcDom.toFixed(1)+'%',detail:'Capital in BTC, altcoins suffering'});}
    else if(btcDom<47){bullCount++;signals.push({bull:true,label:'BTC dominance '+btcDom.toFixed(1)+'%',detail:'Capital rotating into alts — good for XRP'});}
    else signals.push({bull:null,label:'BTC dominance '+btcDom.toFixed(1)+'% neutral',detail:'No strong rotation signal'});
  }

  // ── 9. Macro (risk environment) ──
  if(riskMode==='calm'){bullCount++;signals.push({bull:true,label:'Macro: risk-on',detail:'Supportive environment for XRP'});}
  else if(riskMode==='riskoff'){bearCount++;signals.push({bull:false,label:'Macro: risk-off active',detail:'Geopolitical headwind for XRP'});}
  else signals.push({bull:null,label:'Macro: mixed signals',detail:'Monitor closely'});

  // ── Fear & Greed overlay ──
  let fgNote='';
  if(fearGreed!==null){
    if(fearGreed<=20)fgNote='Extreme Fear ('+fearGreed+') — historically good time to hold/buy';
    else if(fearGreed<=35)fgNote='Fear ('+fearGreed+') — market nervous but not panic';
    else if(fearGreed>=75)fgNote='Extreme Greed ('+fearGreed+') — caution, top may be close';
    else if(fearGreed>=60)fgNote='Greed ('+fearGreed+') — sentiment elevated';
  }

  // ── Confluence Score ──
  const total=bullCount+bearCount;
  const bullProb=total>0?Math.round(50+(bullCount-bearCount)/total*32):50;
  const finalBull=Math.max(18,Math.min(82,bullProb));
  const finalBear=100-finalBull;

  // ── Volatility / Coiling ──
  const atrNow=calcATR(ohlcData,5),atrAvg=calcATR(ohlcData,14);
  const coiling=atrNow&&atrAvg&&atrNow<atrAvg*0.6;

  // ── Dynamic levels ──
  const dynLevels=getDynamicLevels(closes);
  const nearestSupport=dynLevels.nearestSupport?dynLevels.nearestSupport.toFixed(3):LEVELS.support2.toFixed(2);
  const nearestRes=dynLevels.nearestRes?dynLevels.nearestRes.toFixed(3):LEVELS.res1.toFixed(2);

  // ── Pattern ──
  let pattern;
  if(coiling&&bullCount>=bearCount)pattern='COILING — BULLISH BREAKOUT SETUP';
  else if(coiling)pattern='COILING — DIRECTION PENDING';
  else if(bullCount>=5&&bearCount<=1)pattern='STRONG BULLISH CONFLUENCE';
  else if(bullCount>=4&&rsiVal<=40)pattern='OVERSOLD BOUNCE SETUP';
  else if(bullCount>=3&&bearCount<=2)pattern='MILD BULLISH BIAS';
  else if(bearCount>=5&&bullCount<=1)pattern='STRONG BEARISH PRESSURE';
  else if(bearCount>=4)pattern='DOWNSIDE RISK ELEVATED';
  else pattern='CONSOLIDATION — BALANCED';

  // ── Next Move ──
  let nextMove;
  if(bullCount>bearCount+2){
    nextMove=price<parseFloat(nearestRes)?'Likely test of $'+nearestRes+' resistance next':'Eyes on $'+LEVELS.target+' target — '+((LEVELS.target-price)/price*100).toFixed(1)+'% away';
  }else if(bearCount>bullCount+2){
    nextMove=price>parseFloat(nearestSupport)?'$'+nearestSupport+' support likely tested — watch closely':'Stop at $'+LEVELS.stop+' is the next significant level';
  }else{
    nextMove='Range play between $'+nearestSupport+' support and $'+nearestRes+' resistance';
  }

  // ── Action ──
  let action,actionColor,trigger;
  if(bullCount>=5&&riskMode==='calm'){
    action='HOLD / ADD';actionColor='var(--green)';
    trigger='Strong confluence. Consider adding at support with stop maintained.';
  }else if(bullCount>=4){
    action='HOLD';actionColor='var(--green)';
    trigger='Setup building. Let it run. Review only if $'+nearestSupport+' breaks.';
  }else if(bullCount>=2&&bearCount<=2){
    action='HOLD';actionColor='var(--amber)';
    trigger='Balanced. Your stop and target are doing the work.';
  }else if(bearCount>=4&&riskMode==='riskoff'){
    action='PROTECT';actionColor='var(--red)';
    trigger='Multiple bear signals plus risk-off macro. Review position size.';
  }else if(bearCount>=4){
    action='CAUTION';actionColor='var(--red)';
    trigger='Downside risk elevated. Stop at $1.11 is protecting you.';
  }else{
    action='WATCH';actionColor='var(--amber)';
    trigger='Mixed signals. No action needed — monitor $'+nearestSupport+' closely.';
  }

  return{bullCount,bearCount,bullProb:finalBull,bearProb:finalBear,pattern,nextMove,action,actionColor,trigger,signals,rsiVal,fgNote,coiling,nearestSupport,nearestRes,ma7,ma20};
}

function cryptoScore(change,vol,mcap){
  const m=change*.6,ratio=(vol/mcap)*100,vs=Math.min(ratio,10);
  let conv=0;
  if(change>0&&ratio>5)conv=2;else if(change<0&&ratio>5)conv=-1;
  return{score:parseFloat((m+vs+conv).toFixed(2)),vs:parseFloat(vs.toFixed(2)),conv,ratio:parseFloat(ratio.toFixed(3)),m:parseFloat(m.toFixed(2))};
}
function cryptoSig(s){
  if(s>8)return{l:'STRONG BUY',c:'bsb'};
  if(s>4)return{l:'BUY',c:'bb'};
  if(s>0)return{l:'WATCH',c:'bw'};
  if(s>-4)return{l:'AVOID',c:'ba'};
  return{l:'BEARISH',c:'bbr'};
}
function renderCrypto(coins){
  const list=document.getElementById('cryptoList');list.innerHTML='';

    const ps=pnl>=0?'+':'',col=pnl>=0?'var(--green)':'var(--red)';
    const risk=c.price-STOP,reward=TARGET-c.price,rr=(reward/risk).toFixed(2);
    xrpHTML=`<div class="pos-sec">
      <div class="sh-title">My position</div>
      <div class="sh-row"><span class="sh-rl">Entry</span><span class="sh-rv">$1.3081</span></div>
      <div class="sh-row"><span class="sh-rl">Units</span><span class="sh-rv">14.716 XRP</span></div>
      <div class="sh-row"><span class="sh-rl">Invested</span><span class="sh-rv">$${INVESTED}</span></div>
      <div class="sh-row"><span class="sh-rl">P&L</span><span class="sh-rv" style="color:${col}">${ps}$${Math.abs(pnl).toFixed(2)} (${ps}${p.toFixed(2)}%)</span></div>
      <div class="sh-row"><span class="sh-rl">Risk / Reward</span><span class="sh-rv" style="color:${parseFloat(rr)>=2?'var(--green)':'var(--amber)'}">1:${rr}</span></div>
      <div class="sh-row"><span class="sh-rl">Stop loss</span><span class="sh-rv dn">$1.11</span></div>
      <div class="sh-row"><span class="sh-rl">Take profit</span><span class="sh-rv up">$1.70</span></div>
    </div>`;
  }
  document.getElementById('sheetBody').innerHTML=`
    <div class="sh-hdr">
      <div><div class="sh-sym" style="${isXrp?'color:var(--blue)':''}">${c.symbol.toUpperCase()}</div><div class="sh-name">${c.name}</div></div>
      <div><div class="sh-price">${fmtP(c.price)}</div><div class="sh-chg ${pc(c.change)}">${pct(c.change)}</div></div>
    </div>
    <div class="sh-grid">
      <div class="sh-stat"><div class="sh-stat-l">Market Cap</div><div class="sh-stat-v">${fmtLarge(c.mcap)}</div></div>
      <div class="sh-stat"><div class="sh-stat-l">Volume 24h</div><div class="sh-stat-v">${fmtLarge(c.vol)}</div></div>
      <div class="sh-stat"><div class="sh-stat-l">Vol / MCap</div><div class="sh-stat-v">${s.ratio.toFixed(2)}%</div></div>
      <div class="sh-stat"><div class="sh-stat-l">Signal</div><div class="sh-stat-v"><span class="badge ${sg.c}">${sg.l}</span></div></div>
    </div>
    <div class="sh-title">Score breakdown</div>
    <div class="sh-row"><span class="sh-rl">Momentum (24h x 0.6)</span><span class="sh-rv">${s.m}</span></div>
    <div class="sh-row"><span class="sh-rl">Volume score (cap 10)</span><span class="sh-rv">${s.vs}</span></div>
    <div class="sh-row"><span class="sh-rl">Conviction</span><span class="sh-rv">${s.conv>0?'+'+s.conv:s.conv}</span></div>
    <div class="sh-row tot"><span class="sh-rl">Total score</span><span class="sh-rv"><span class="badge ${sg.c}">${s.score}</span></span></div>
    ${xrpHTML}`;
  openSheet();
}

// ── Main Scan ─────────────────────────────────────────────────────────
async function runScan(){
  const fab=document.getElementById('fab'),status=document.getElementById('statusMsg');
  fab.disabled=true;fab.textContent='SCANNING...';
  status.textContent='fetching all data...';
  document.getElementById('analystCard').innerHTML='<div style="font-family:var(--mono);font-size:10px;color:var(--t3)">Running 9-factor analysis...</div>';

  const[cgSimpleRes,cgMarketsRes,cgGlobalRes,xrpHistRes,btcHistRes,ohlcRes,fgRes]=await Promise.allSettled([
    fetchCGSimple('pax-gold,tether','usd,jpy,chf'),
    fetchCGMarkets(),
    fetchCGGlobal(),
    fetchHistory('ripple',30),
    fetchHistory('bitcoin',30),
    fetchOHLC('ripple',14),
    fetchFearGreed()
  ]);

  // ── Parse CG Simple (Gold + FX) ──
  if(cgSimpleRes.status==='fulfilled'){
    const d=cgSimpleRes.value;
    if(d['pax-gold']){
      baroData.gold={price:d['pax-gold'].usd,change:d['pax-gold'].usd_24h_change||0};
    }
    if(d['tether']){
      baroData.jpy={price:d['tether'].jpy,change:d['tether'].jpy_24h_change||0};
      baroData.chf={price:d['tether'].chf,change:d['tether'].chf_24h_change||0};
      // Oil proxy: use tether/USD change as baseline — we approximate oil from gold correlation
      // In absence of direct oil API, show as unavailable gracefully
    }
  }

  // ── Parse Global (BTC dominance + Oil approx) ──
  let btcDom=null;
  if(cgGlobalRes.status==='fulfilled'){
    const g=cgGlobalRes.value.data;
    btcDom=g.market_cap_percentage.btc||null;
    if(btcDom!==null){
      const prevDom=btcDom; // no historical, show current with neutral change
      baroData.dom={value:btcDom,change:0};
    }
  }

  // ── Fear & Greed ──
  let fearGreed=null;
  if(fgRes.status==='fulfilled'){
    const fg=fgRes.value;
    fearGreed=fg.value;
    baroData.fg={value:fg.value,label:fg.label,change:null};
  }

  // ── Parse Markets ──
  let currentPrice=null,xrpChange=null,btcChange=null;
  if(cgMarketsRes.status==='fulfilled'){
    const coins=cgMarketsRes.value;
    const xrp=coins.find(c=>c.symbol.toUpperCase()==='XRP');
    const btc=coins.find(c=>c.symbol.toUpperCase()==='BTC');
    const oil=coins.find(c=>c.symbol.toUpperCase()==='USO');
    if(xrp){currentPrice=xrp.price;xrpChange=xrp.change;updatePos(xrp.price);}
    if(btc){btcChange=btc.change;}
    // Oil via crude proxy token if available, else skip gracefully
    const oilProxy=coins.find(c=>['UCO','OIL'].includes(c.symbol.toUpperCase()));
    if(oilProxy){baroData.oil={price:oilProxy.price,change:oilProxy.change};}
    else{
      // Estimate oil signal from gold (they correlate during geopolitical events)
      // If gold is risk-off signal, flag oil as elevated too
      if(baroData.gold&&baroData.gold.change>1){baroData.oil={price:null,change:baroData.gold.change*0.8,estimated:true};}
      else if(baroData.gold){baroData.oil={price:null,change:baroData.gold.change*0.5,estimated:true};}
    }
    renderCrypto(coins);
  }

  // ── Render Barometers & Risk ──
  const riskMode=renderBaros();

  // ── Run Technical Analysis ──
  if(xrpHistRes.status==='fulfilled'&&btcHistRes.status==='fulfilled'&&currentPrice!==null){
    const ohlc=ohlcRes.status==='fulfilled'?ohlcRes.value:null;
    const analysis=runAnalysis(
      xrpHistRes.value,btcHistRes.value,ohlc,
      riskMode,currentPrice,xrpChange||0,btcChange,btcDom,fearGreed
    );
    renderAnalyst(analysis);
  }else{
    document.getElementById('analystCard').innerHTML='<div style="font-family:var(--mono);font-size:10px;color:var(--t3)">Historical data unavailable</div>';
    document.getElementById('confluenceCount').textContent='data unavailable';
  }

  const now=new Date();
  const parts=[];
  if(cgSimpleRes.status==='fulfilled')parts.push('Gold+FX');
  if(cgMarketsRes.status==='fulfilled')parts.push('Markets');
  if(cgGlobalRes.status==='fulfilled')parts.push('Dominance');
  if(fgRes.status==='fulfilled')parts.push('Fear/Greed');
  if(xrpHistRes.status==='fulfilled')parts.push('30d history');
  status.textContent='updated '+now.toLocaleTimeString('en-GB')+' · '+parts.join(', ');
  fab.disabled=false;fab.textContent='REFRESH ALL';
}

runScan();
</script>
